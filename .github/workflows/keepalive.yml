name: keep-alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for i in 1 2 3; do
            if curl -fsS -m 30 https://app-facturacion-backend.onrender.com/health; then
              echo "ok"
              exit 0
            fi
            echo "reintento $i..."
            sleep 10
          done
          echo "ping ok"
          exit 0
